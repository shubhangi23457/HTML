# 14. HTML LINKS & METADATA

<!-- NOTES -->

<!--
============================================================
1. FAVICON
============================================================

A favicon is the small icon displayed in the browser tab next
to the webpage title.

It is added using the <link> element inside <head>.

Syntax:
<link rel="icon" href="favicon.ico">

Common formats:
- .ico
- .png
- .svg

Example:
<link rel="icon" type="image/png" href="images/favicon.png">

The favicon does not appear as normal content inside the page.
-->

<!--
============================================================
2. META TAGS
============================================================

<meta> tags provide information about an HTML document.

They are placed inside the <head> section.

Meta tags are not normally displayed on the webpage.

Common uses:
- Character encoding
- Viewport settings
- Page description
- Keywords
- Author information
- Other metadata
-->

<!--
============================================================
3. CHARSET
============================================================

The charset attribute specifies the character encoding used
by the HTML document.

The commonly used encoding is UTF-8.

Syntax:
<meta charset="UTF-8">

UTF-8 supports a very large range of characters, including:
- English
- Indian languages
- Mathematical symbols
- Currency symbols
- Emojis

It should normally be included near the beginning of <head>.
-->

<!--
============================================================
4. VIEWPORT
============================================================

The viewport meta tag controls how a webpage is displayed on
different screen sizes, especially mobile devices.

Common syntax:

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

Meaning:

width=device-width
- Makes the page width match the device's screen width.

initial-scale=1.0
- Sets the initial zoom level to 100%.

This is important for responsive webpages.
-->

<!--
============================================================
5. DESCRIPTION
============================================================

The description meta tag provides a short description of the
webpage.

Syntax:

<meta name="description"
      content="Description of the webpage">

Search engines may use this description as part of the search
result snippet, although they decide what text to display.

A good description should be:
- Short
- Relevant
- Specific to the page
-->

<!--
============================================================
6. KEYWORDS
============================================================

The keywords meta tag was historically used to specify keywords
related to a webpage.

Example:

<meta name="keywords"
      content="HTML, CSS, JavaScript, web development">

Modern major search engines generally do not use the keywords
meta tag as a significant ranking factor.

It can still be useful for learning HTML metadata, but it should
not be relied upon for modern SEO.
-->

<!--
============================================================
7. AUTHOR
============================================================

The author meta tag identifies the author of the webpage.

Syntax:

<meta name="author"
      content="Your Name">

Example:
<meta name="author" content="Shubhangi">
-->

<!--
============================================================
8. OPEN GRAPH METADATA
============================================================

Open Graph metadata is used to control how a webpage appears
when its URL is shared on social media and other platforms that
support Open Graph.

Open Graph properties commonly use:

<meta property="og:...">

Important Open Graph tags:

og:title
- Title displayed when the page is shared.

og:description
- Description displayed with the shared page.

og:image
- Image displayed with the shared page.

og:url
- URL of the webpage.

og:type
- Type of content, such as website or article.

Example:

<meta property="og:title"
      content="My Electronics Store">

<meta property="og:description"
      content="Shop for the latest electronic products.">

<meta property="og:image"
      content="https://example.com/images/store.jpg">

<meta property="og:url"
      content="https://example.com">

<meta property="og:type"
      content="website">
-->

<!--
============================================================
9. LINK ELEMENT VS META ELEMENT
============================================================

<link>
- Used to define relationships between the current document
  and external resources.
- Commonly used for favicons and stylesheets.

Example:
<link rel="icon" href="favicon.ico">

<meta>
- Provides metadata about the HTML document.
- Usually placed inside <head>.

Example:
<meta name="description"
      content="My website">
-->

<!-- ====================================================== -->

<!-- COMBINED CODE -->

<!-- ====================================================== -->

<!DOCTYPE html>

<html lang="en">

<head>

```
<!-- Charset -->
<meta charset="UTF-8">

<!-- Viewport -->
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- Page Title -->
<title>Electronics Store</title>

<!-- Favicon -->
<link rel="icon"
      type="image/png"
      href="images/favicon.png">

<!-- Description -->
<meta name="description"
      content="Shop for electronics including phones, laptops, headphones and accessories.">

<!-- Keywords -->
<meta name="keywords"
      content="electronics, phones, laptops, headphones, accessories">

<!-- Author -->
<meta name="author"
      content="Shubhangi">

<!-- Open Graph Metadata -->

<meta property="og:title"
      content="Electronics Store">

<meta property="og:description"
      content="Explore phones, laptops, headphones and other electronic products.">

<meta property="og:image"
      content="https://example.com/images/store.jpg">

<meta property="og:url"
      content="https://example.com">

<meta property="og:type"
      content="website">

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    header {
        padding: 20px;
        background-color: lightgray;
    }

    section {
        margin-top: 20px;
    }
</style>
```

</head>

<body>

```
<header>

    <h1>Electronics Store</h1>

    <p>
        Find phones, laptops, headphones and accessories.
    </p>

</header>

<section>

    <h2>About This Website</h2>

    <p>
        This page demonstrates favicon and different
        types of HTML metadata.
    </p>

</section>
```

</body>

</html>
