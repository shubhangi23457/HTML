# 15. EMBEDDING & FRAMES

<!-- ====================================================== -->

<!-- NOTES -->

<!-- ====================================================== -->

<!--
============================================================
1. IFRAME
============================================================

The <iframe> element is used to embed another webpage or
external content inside the current webpage.

Syntax:

<iframe src="URL"></iframe>

Common attributes:
- src       -> URL of the content
- width     -> Width of the frame
- height    -> Height of the frame
- title     -> Accessible description
- loading   -> Controls loading behavior
- allow     -> Permissions for certain features
- allowfullscreen -> Allows fullscreen mode

Example:

<iframe
    src="https://example.com"
    width="600"
    height="400"
    title="Example Website">
</iframe>
-->

<!--
============================================================
2. EMBEDDED WEB PAGES
============================================================

An external webpage can be displayed inside an iframe.

Example:

<iframe
    src="https://example.com"
    width="600"
    height="400"
    title="Example website">
</iframe>

Important:
- The external website may prevent iframe embedding.
- This is controlled by the external website's security
  policies.
- Do not assume every website can be embedded.
-->

<!--
============================================================
3. GOOGLE MAPS EMBEDDING
============================================================

Google Maps can be embedded into a webpage using an iframe
embed code.

A typical Google Maps embed looks like:

<iframe
    src="GOOGLE_MAPS_EMBED_URL"
    width="600"
    height="450"
    style="border:0;"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
</iframe>

The exact URL should normally be generated using the
Google Maps "Share" or "Embed a map" option.

Google Maps embed URLs can include a specific:
- Place
- Address
- Location
- Map view

-->

<!--
============================================================
4. YOUTUBE EMBEDDING
============================================================

YouTube videos can be embedded using an iframe.

Example:

<iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/VIDEO_ID"
    title="YouTube video"
    allowfullscreen>
</iframe>

The /embed/ format is used for embedding a YouTube video.

Example:

Normal YouTube URL:
https://www.youtube.com/watch?v=ABC123

Embed URL:
https://www.youtube.com/embed/ABC123

The video ID is used in the embed URL.
-->

<!--
============================================================
5. EXTERNAL CONTENT
============================================================

External content means content hosted by another website or
service that is displayed on your webpage.

Examples:
- YouTube videos
- Google Maps
- External webpages
- Online documents
- Social media widgets
- Other supported external services

The iframe is commonly used for this purpose.

Important:
External content can have restrictions such as:
- Embedding disabled by the provider
- Cross-origin security restrictions
- Authentication requirements
- Provider-specific permissions
- Content Security Policy restrictions
-->

<!--
============================================================
6. IFRAME ATTRIBUTES
============================================================

src
----
Specifies the URL of the content to embed.

width
-----
Specifies the width of the iframe.

height
------
Specifies the height of the iframe.

title
-----
Provides an accessible description of the iframe.

loading
-------
Controls when the iframe is loaded.

Common values:
- lazy
- eager

allow
-----
Specifies permissions for features used by embedded content.

allowfullscreen
---------------
Allows embedded content to use fullscreen mode when supported.

referrerpolicy
--------------
Controls what referrer information is sent when loading the
embedded resource.
-->

<!--
============================================================
7. IFRAME AND SECURITY
============================================================

Embedding external content can have security implications.

The sandbox attribute can restrict what the embedded document
is allowed to do.

Example:

<iframe
    src="example.html"
    sandbox>
</iframe>

Additional permissions can be specified when required:

sandbox="allow-scripts"

Only give an embedded document the permissions it actually needs.

External websites can also prevent embedding using security
headers such as Content-Security-Policy or X-Frame-Options.
-->

<!-- COMBINED CODE -->

<!-- ====================================================== -->

<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Embedding and Frames</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    .box {
        border: 1px solid #333;
        padding: 15px;
        margin: 20px 0;
    }

    iframe {
        max-width: 100%;
        border: 1px solid #555;
    }
</style>
```

</head>

<body>

```
<h1>Embedding & Frames</h1>

<!-- ================================================= -->
<!-- Embedded Web Page -->
<!-- ================================================= -->

<div class="box">

    <h2>1. Embedded Web Page</h2>

    <iframe
        src="https://example.com"
        width="600"
        height="300"
        title="Example Website"
        loading="lazy">
    </iframe>

</div>


<!-- ================================================= -->
<!-- Google Maps -->
<!-- ================================================= -->

<div class="box">

    <h2>2. Google Maps Embedding</h2>

    <!--
    Replace the src value with the Google Maps embed URL
    generated from Google Maps.

    Example structure:

    <iframe
        src="GOOGLE_MAPS_EMBED_URL"
        width="600"
        height="350"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
    </iframe>
    -->

    <p>
        Google Maps can be embedded here using the
        official Google Maps embed code.
    </p>

</div>


<!-- ================================================= -->
<!-- YouTube -->
<!-- ================================================= -->

<div class="box">

    <h2>3. YouTube Embedding</h2>

    <!--
    Replace VIDEO_ID with the ID of a YouTube video.

    Example:
    https://www.youtube.com/embed/VIDEO_ID
    -->

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video player"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write;
               encrypted-media; gyroscope; picture-in-picture;
               web-share"
        allowfullscreen>
    </iframe>

</div>


<!-- ================================================= -->
<!-- External Content -->
<!-- ================================================= -->

<div class="box">

    <h2>4. External Content</h2>

    <iframe
        src="https://example.com"
        width="600"
        height="250"
        title="External Content"
        loading="lazy">
    </iframe>

</div>


<!-- ================================================= -->
<!-- Iframe with Sandbox -->
<!-- ================================================= -->

<div class="box">

    <h2>5. Sandboxed Iframe</h2>

    <iframe
        srcdoc="<h2>Hello!</h2><p>This content is inside a sandboxed iframe.</p>"
        width="600"
        height="200"
        title="Sandboxed Content"
        sandbox>
    </iframe>

</div>
```

</body>

</html>
